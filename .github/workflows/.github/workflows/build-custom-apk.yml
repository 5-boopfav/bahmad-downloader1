name: Build Fork APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 5-boopfav ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Root fix for settings.gradle and keystore.properties
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          settings_path = Path("settings.gradle")
          if settings_path.exists():
              content = settings_path.read_text(encoding="utf-8")
              fixed = content.replace("PluginManagement", "pluginManagement", 1)
              if fixed != content:
                  settings_path.write_text(fixed, encoding="utf-8")
                  print("Patched PluginManagement -> pluginManagement in runtime workspace.")
          EOF

          keytool -genkeypair -v \
            -keystore debug-temp.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat << 'EOF' > keystore.properties
          signingConfig.storeFile=debug-temp.keystore
          signingConfig.storePassword=android
          signingConfig.keyAlias=androiddebugkey
          signingConfig.keyPassword=android
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --stacktrace

      - name: Cleanup temporary files
        if: always()
        run: rm -f keystore.properties debug-temp.keystore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bahmad-downloader1-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: ignore
