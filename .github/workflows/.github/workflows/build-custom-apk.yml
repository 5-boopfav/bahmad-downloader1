name: Build Fork APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Patch settings and prepare keystore
        run: |
          sed -i 's/^[[:space:]]*[Pp]lugin[Mm]anagement[[:space:]]*{/pluginManagement {/' settings.gradle

          keytool -genkeypair -v \
            -keystore debug-temp.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat << 'EOF' > keystore.properties
          signingConfig.storeFile=debug-temp.keystore
          signingConfig.storePassword=android
          signingConfig.keyAlias=androiddebugkey
          signingConfig.keyPassword=android
          EOF

      - name: Build GitHub Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --stacktrace

      - name: Cleanup temporary files
        if: always()
        run: rm -f keystore.properties debug-temp.keystore

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bahmad-downloader1-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: ignore
